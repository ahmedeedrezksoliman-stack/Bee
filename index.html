<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Beeuora | بيورا - عسل طبيعي</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cream: #ead8bd;
            --cream-dark: #d6bd9b;
            --white: #ffffff;

            --gold: #c18a32;
            --gold-dark: #875817;
            --gold-light: #e1b766;

            --brown: #33251a;
            --brown-light: #705b46;

            --price-bg: #fff1cf;
            --price-color: #9a6417;

            --border: rgba(51, 37, 26, .12);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Cairo", sans-serif;
            color: var(--brown);
            background:
                linear-gradient(
                    135deg,
                    #ead8bd 0%,
                    #dfc7a4 45%,
                    #d5b88f 100%
                );
            min-height: 100vh;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            cursor: pointer;
        }

        img {
            max-width: 100%;
            display: block;
        }

        /* =========================
           HEADER
        ========================= */

        header {
            height: 78px;
            background: rgba(255,255,255,.97);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 18px rgba(51,37,26,.08);
        }

        .header-inner {
            max-width: 1400px;
            height: 100%;
            margin: auto;
            padding: 0 30px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 25px;
        }

        .logo {
            font-family: "Playfair Display", serif;
            font-size: 30px;
            font-weight: 700;
            color: var(--brown);
            text-decoration: none;
            white-space: nowrap;
        }

        .logo span {
            color: var(--gold);
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav button {
            border: none;
            background: transparent;
            color: var(--brown);
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            transition: .2s;
        }

        .nav button:hover {
            background: #f5ead9;
            color: var(--gold-dark);
        }

        .cart-button {
            position: relative;
            width: 44px;
            height: 44px;
            border: 1px solid var(--border);
            background: #fff;
            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--brown);
        }

        .cart-count {
            position: absolute;
            top: -6px;
            left: -6px;

            min-width: 20px;
            height: 20px;
            padding: 0 5px;

            background: var(--gold);
            color: white;

            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            width: 100%;
            background: #fff;
            overflow: hidden;
        }

        .hero img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        /* =========================
           SLIDER
        ========================= */

        .slider-section {
            max-width: 1400px;
            margin: 28px auto 0;
            padding: 0 25px;
        }

        .slider {
            position: relative;
            overflow: hidden;
            border-radius: 22px;
            background: #fff;
            box-shadow: 0 10px 30px rgba(51,37,26,.13);
        }

        .slider-viewport {
            width: 100%;
            overflow: hidden;
        }

        .slider-track {
            display: flex;
            width: 100%;
            direction: ltr;
            transition: transform .5s ease;
        }

        .slide {
            min-width: 100%;
            flex: 0 0 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff;
        }

        .slide img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        .slider-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);

            width: 46px;
            height: 46px;

            border: none;
            border-radius: 50%;

            background: rgba(255,255,255,.9);
            color: var(--brown);

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow: 0 5px 15px rgba(0,0,0,.12);

            z-index: 5;
            transition: .2s;
        }

        .slider-arrow:hover {
            background: white;
            transform: translateY(-50%) scale(1.05);
        }

        .slider-prev {
            left: 15px;
        }

        .slider-next {
            right: 15px;
        }

        .slider-dots {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);

            display: flex;
            gap: 7px;
            z-index: 5;
        }

        .slider-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            border: none;

            background: rgba(255,255,255,.7);
            transition: .25s;
            padding: 0;
        }

        .slider-dot.active {
            width: 24px;
            border-radius: 20px;
            background: var(--gold);
        }

        /* =========================
           MAIN
        ========================= */

        main {
            max-width: 1400px;
            margin: auto;
            padding: 35px 25px 100px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0 25px;
        }

        .section-title {
            font-size: 28px;
            font-weight: 800;
            color: var(--brown);
        }

        .section-subtitle {
            color: var(--brown-light);
            font-size: 14px;
            margin-top: 4px;
        }

        /* =========================
           PRODUCTS
        ========================= */

        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        .product-card {
            background: rgba(255,255,255,.96);
            border: 1px solid rgba(51,37,26,.08);
            border-radius: 20px;
            overflow: hidden;

            box-shadow: 0 8px 25px rgba(51,37,26,.09);

            transition:
                transform .25s ease,
                box-shadow .25s ease;

            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 14px 32px rgba(51,37,26,.15);
        }

        .product-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #f7f0e5;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform .3s ease;
        }

        .product-card:hover .product-image img {
            transform: scale(1.04);
        }

        .product-info {
            padding: 20px;
        }

        .product-name {
            font-size: 18px;
            font-weight: 800;
            color: var(--brown);
            margin-bottom: 10px;
            line-height: 1.5;
        }

        .product-description {
            color: var(--brown-light);
            font-size: 13px;
            line-height: 1.7;
            min-height: 42px;
            margin-bottom: 15px;
        }

        .product-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .price {
            display: inline-flex;
            align-items: center;
            gap: 5px;

            background: var(--price-bg);
            color: var(--price-color);

            padding: 7px 11px;
            border-radius: 10px;

            font-size: 21px;
            font-weight: 800;

            border: 1px solid rgba(193,138,50,.2);
        }

        .price small {
            font-size: 12px;
            font-weight: 700;
        }

        .add-btn {
            width: 43px;
            height: 43px;

            border: none;
            border-radius: 12px;

            background: var(--brown);
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: .2s;
        }

        .add-btn:hover {
            background: var(--gold-dark);
            transform: scale(1.05);
        }

        /* =========================
           PAGES
        ========================= */

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            border: none;
            background: rgba(255,255,255,.8);

            padding: 10px 16px;
            border-radius: 10px;

            color: var(--brown);
            font-weight: 700;

            margin-bottom: 25px;
        }

        /* =========================
           PRODUCT DETAIL
        ========================= */

        .product-detail {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;

            background: rgba(255,255,255,.95);
            padding: 35px;
            border-radius: 24px;

            box-shadow: 0 10px 30px rgba(51,37,26,.1);
        }

        .detail-image {
            background: #f7f0e5;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 1 / 1;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .detail-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .detail-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .detail-title {
            font-size: 38px;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .detail-description {
            font-size: 16px;
            color: var(--brown-light);
            line-height: 2;
            margin-bottom: 25px;
        }

        .detail-price {
            font-size: 32px;
            font-weight: 800;
            color: var(--price-color);
            background: var(--price-bg);

            display: inline-flex;
            width: fit-content;

            padding: 10px 18px;
            border-radius: 14px;
            margin-bottom: 25px;
        }

        .detail-add {
            border: none;
            background: var(--brown);
            color: white;

            padding: 15px 25px;
            border-radius: 13px;

            font-size: 16px;
            font-weight: 700;

            transition: .2s;
        }

        .detail-add:hover {
            background: var(--gold-dark);
        }

        /* =========================
           CART
        ========================= */

        .cart-container {
            background: rgba(255,255,255,.96);
            border-radius: 22px;
            padding: 30px;

            box-shadow: 0 10px 30px rgba(51,37,26,.1);
        }

        .cart-item {
            display: grid;
            grid-template-columns: 90px 1fr auto auto;
            align-items: center;
            gap: 20px;

            padding: 18px 0;
            border-bottom: 1px solid var(--border);
        }

        .cart-item-image {
            width: 90px;
            height: 90px;
            background: #f7f0e5;
            border-radius: 14px;
            overflow: hidden;
        }

        .cart-item-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .cart-item-name {
            font-size: 17px;
            font-weight: 800;
        }

        .cart-item-price {
            color: var(--price-color);
            font-weight: 800;
            font-size: 17px;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-controls button {
            width: 32px;
            height: 32px;

            border: 1px solid var(--border);
            background: white;
            border-radius: 8px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .quantity {
            min-width: 25px;
            text-align: center;
            font-weight: 700;
        }

        .remove-item {
            border: none;
            background: transparent;
            color: #a13b2d;
        }

        .cart-summary {
            margin-top: 25px;
            padding-top: 25px;
            border-top: 2px solid var(--border);

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .cart-total-label {
            font-size: 18px;
            font-weight: 700;
        }

        .cart-total {
            font-size: 28px;
            color: var(--price-color);
            font-weight: 800;
        }

        .checkout-btn {
            border: none;
            background: var(--brown);
            color: white;

            padding: 14px 28px;
            border-radius: 12px;

            font-size: 16px;
            font-weight: 700;

            margin-top: 20px;
        }

        .empty-cart {
            text-align: center;
            padding: 70px 20px;
            color: var(--brown-light);
        }

        .empty-cart svg {
            width: 60px;
            height: 60px;
            margin: 0 auto 15px;
            opacity: .5;
        }

        /* =========================
           MOBILE NAV
        ========================= */

        .mobile-nav {
            display: none;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1100px) {
            .products-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 800px) {

            header {
                height: 67px;
            }

            .header-inner {
                padding: 0 15px;
            }

            .logo {
                font-size: 25px;
            }

            .nav {
                display: none;
            }

            .slider-section {
                padding: 0 12px;
                margin-top: 15px;
            }

            .slider {
                border-radius: 14px;
            }

            .slider-arrow {
                width: 36px;
                height: 36px;
            }

            main {
                padding: 25px 12px 90px;
            }

            .section-title {
                font-size: 23px;
            }

            .products-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 13px;
            }

            .product-info {
                padding: 13px;
            }

            .product-name {
                font-size: 15px;
            }

            .product-description {
                font-size: 11px;
                min-height: 35px;
            }

            .price {
                font-size: 16px;
                padding: 6px 8px;
            }

            .add-btn {
                width: 38px;
                height: 38px;
            }

            .product-detail {
                grid-template-columns: 1fr;
                gap: 25px;
                padding: 18px;
            }

            .detail-title {
                font-size: 27px;
            }

            .detail-price {
                font-size: 25px;
            }

            .cart-container {
                padding: 18px;
            }

            .cart-item {
                grid-template-columns: 65px 1fr auto;
                gap: 10px;
            }

            .cart-item-image {
                width: 65px;
                height: 65px;
            }

            .cart-item-price {
                grid-column: 2;
            }

            .quantity-controls {
                grid-column: 3;
                grid-row: 1 / span 2;
            }

            .remove-item {
                grid-column: 2;
            }

            .cart-summary {
                flex-direction: column;
                align-items: stretch;
                gap: 15px;
            }

            .mobile-nav {
                position: fixed;
                bottom: 0;
                right: 0;
                left: 0;

                height: 65px;

                background: rgba(255,255,255,.97);
                border-top: 1px solid var(--border);

                display: flex;
                align-items: center;
                justify-content: space-around;

                z-index: 1000;

                box-shadow: 0 -5px 20px rgba(51,37,26,.1);
            }

            .mobile-nav button {
                border: none;
                background: transparent;

                color: var(--brown-light);

                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 3px;

                font-size: 10px;
            }

            .mobile-nav button.active {
                color: var(--gold-dark);
            }
        }

        @media (max-width: 450px) {

            .products-grid {
                gap: 10px;
            }

            .product-name {
                font-size: 14px;
            }

            .price {
                font-size: 14px;
            }

            .product-info {
                padding: 11px;
            }

            .slider-arrow {
                width: 32px;
                height: 32px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         HEADER
    ========================= -->

    <header>
        <div class="header-inner">

            <a href="#" class="logo" onclick="navigate('home'); return false;">

    <!-- =========================

    <!-- =========================

        </main>

    </div>


    <!-- =========================
         CART PAGE
    ========================= -->

    <div id="cartPage" class="page">

            <button class="back-button" onclick="navigate('home')">

            <div class="section-header">

                    <h2 class="section-title">سلة المشتريات</h2>

    </div>


    <!-- =========================
         MOBILE NAV
    ========================= -->

    <div class="mobile-nav">

        <button onclick="navigate('home')">

        </button>

        <button onclick="navigate('products')">

        </button>

        <button onclick="navigate('cart')">
            <i data-lucide="shopping-bag"></i>
            السلة
        </button>

    </div>

        /* =========================
           PRODUCTS
        ========================= */

        const products = [

            {
                id: 1,

            },

            {

                name: "عسل زهرة البرسيم",
                price: 216,
                image: "https://i.postimg.cc/q7rCyr02/1789751460411.png",
                description: "عسل طبيعي مستخلص من رحيق أزهار البرسيم."
            },

            {
                id: 3,
                name: "عسل خلطة العريس",
                price: 504,
                image: "https://i.postimg.cc/hjPzZ0XQ/tsmym-bdwn-ʿnwan-20260918-161025-0000.png",
                description: "خلطة مميزة من العسل والمكونات المختارة."
            },

            {
                id: 4,
                name: "عسل مكسرات بالعسل",
                price: 204,
                image: "https://i.postimg.cc/90sDM5Jk/tsmym-bdwn-ʿnwan-20260918-155500-0000.png",
                description: "مزيج غني من العسل الطبيعي والمكسرات."
            },

            {
                id: 5,
                name: "طبق شمع العسل",
                price: 170,
                image: "https://i.postimg.cc/9QnkJcJR/1789758186242.png",
                description: "طبق من شمع العسل الطبيعي بجودة مميزة."
            }

        ];


        /* =========================
           CART
        ========================= */

        let cart = JSON.parse(
            localStorage.getItem("beeuora_cart") || "[]"
        );


        function saveCart() {

            localStorage.setItem(
                "beeuora_cart",
                JSON.stringify(cart)
            );

            updateCartCount();
        }


        function updateCartCount() {

            const count = cart.reduce(
                (total, item) => total + item.quantity,
                0
            );

            const desktopCount =
                document.getElementById("cartCount");

            const mobileCount =
                document.getElementById("cartCountMobile");

            if (desktopCount) {
                desktopCount.textContent = count;
            }

            if (mobileCount) {
                mobileCount.textContent = count;
            }
        }


        function addToCart(productId) {

            const product = products.find(
                p => p.id === productId
            );

            if (!product) return;

            const existing = cart.find(
                item => item.id === productId
            );

            if (existing) {

                existing.quantity++;

            } else {

                cart.push({
                    id: product.id,
                    quantity: 1
                });

            }

            saveCart();

            renderCart();

        }


        function removeFromCart(productId) {

            cart = cart.filter(
                item => item.id !== productId
            );

            saveCart();

            renderCart();
        }


        function changeQuantity(productId, change) {

            const item = cart.find(
                item => item.id === productId
            );

            if (!item) return;

            item.quantity += change;

            if (item.quantity <= 0) {

                cart = cart.filter(
                    item => item.id !== productId
                );

            }

            saveCart();

            renderCart();
        }


        /* =========================
           PRICE
        ========================= */

        function formatPrice(price) {

            return new Intl.NumberFormat("ar-EG").format(price);

        }


        /* =========================
           PRODUCT CARD
        ========================= */

        function createProductCard(product) {

            return `
                <article
                    class="product-card"
                    onclick="openProduct(${product.id})"
                >

                    <div class="product-image">

                        <img
                            src="${product.image}"
                            alt="${product.name}"
                            loading="lazy"
                        >

                    </div>

                    <div class="product-info">

                        <h3 class="product-name">
                            ${product.name}
                        </h3>

                        <p class="product-description">
                            ${product.description}
                        </p>

                        <div class="product-bottom">

                            <div class="price">
                                ${formatPrice(product.price)}
                                <small>جنيه</small>
                            </div>

                            <button
                                class="add-btn"
                                onclick="event.stopPropagation(); addToCart(${product.id})"
                                aria-label="إضافة للسلة"
                            >
                                <i data-lucide="plus"></i>
                            </button>

                        </div>

                    </div>

                </article>
            `;

        }


        function renderProducts() {

            const homeProducts =
                document.getElementById("homeProducts");

            const allProducts =
                document.getElementById("allProducts");

            if (homeProducts) {

                homeProducts.innerHTML =
                    products
                        .map(createProductCard)
                        .join("");

            }

            if (allProducts) {

                allProducts.innerHTML =
                    products
                        .map(createProductCard)
                        .join("");

            }

            lucide.createIcons();

        }


        /* =========================
           PRODUCT DETAILS
        ========================= */

        function openProduct(productId) {

            const product =
                products.find(
                    p => p.id === productId
                );

            if (!product) return;

            renderProductDetails(product);

            navigate("product");

        }


        function renderProductDetails(product) {

            const container =
                document.getElementById("productDetails");

            container.innerHTML = `

                <div class="product-detail">

                    <div class="detail-image">

                        <img
                            src="${product.image}"
                            alt="${product.name}"
                        >

                    </div>

                    <div class="detail-info">

                        <h1 class="detail-title">
                            ${product.name}
                        </h1>

                        <p class="detail-description">
                            ${product.description}
                        </p>

                        <div class="detail-price">
                            ${formatPrice(product.price)}
                            جنيه
                        </div>

                        <button
                            class="detail-add"
                            onclick="addToCart(${product.id})"
                        >
                            إضافة إلى السلة
                        </button>

                    </div>

                </div>

            `;

            lucide.createIcons();

        }


        /* =========================
           CART RENDER
        ========================= */

        function renderCart() {

            const container =
                document.getElementById("cartContainer");

            if (!container) return;

            if (cart.length === 0) {

                container.innerHTML = `

                    <div class="empty-cart">

                        <i data-lucide="shopping-bag"></i>

                        <h3>
                            السلة فارغة
                        </h3>

                        <p>
                            أضف بعض منتجات بيورا إلى السلة
                        </p>

                        <button
                            class="checkout-btn"
                            onclick="navigate('products')"
                        >
                            تصفح المنتجات
                        </button>

                    </div>

                `;

                lucide.createIcons();

                return;
            }


            let total = 0;

            const itemsHTML =
                cart.map(item => {

                    const product =
                        products.find(
                            p => p.id === item.id
                        );

                    if (!product) return "";

                    const itemTotal =
                        product.price * item.quantity;

                    total += itemTotal;

                    return `

                        <div class="cart-item">

                            <div class="cart-item-image">

                                <img
                                    src="${product.image}"
                                    alt="${product.name}"
                                >

                            </div>

                            <div>

                                <div class="cart-item-name">
                                    ${product.name}
                                </div>

                                <div class="cart-item-price">
                                    ${formatPrice(product.price)}
                                    جنيه
                                </div>

                            </div>

                            <div class="quantity-controls">

                                <button
                                    onclick="changeQuantity(${product.id}, 1)"
                                >
                                    +
                                </button>

                                <span class="quantity">
                                    ${item.quantity}
                                </span>

                                <button
                                    onclick="changeQuantity(${product.id}, -1)"
                                >
                                    -
                                </button>

                            </div>

                            <button
                                class="remove-item"
                                onclick="removeFromCart(${product.id})"
                                aria-label="حذف"
                            >
                                <i data-lucide="trash-2"></i>
                            </button>

                        </div>

                    `;

                }).join("");


            container.innerHTML = `

                ${itemsHTML}

                <div class="cart-summary">

                    <div>

                        <div class="cart-total-label">
                            الإجمالي
                        </div>

                        <div class="cart-total">
                            ${formatPrice(total)}
                            جنيه
                        </div>

                    </div>

                    <button
                        class="checkout-btn"
                        onclick="checkout()"
                    >
                        إتمام الطلب
                    </button>

                </div>

            `;

            lucide.createIcons();

        }


        /* =========================
           CHECKOUT
        ========================= */

        function checkout() {

            if (cart.length === 0) return;

            alert(
                "تم تجهيز طلبك. يمكنك الآن إضافة نظام تأكيد الطلب والدفع."
            );

        }


        /* =========================
           NAVIGATION
        ========================= */

        function navigate(page) {

            document
                .querySelectorAll(".page")
                .forEach(el => {
                    el.classList.remove("active");
                });


            const target =
                document.getElementById(
                    page + "Page"
                );

            if (target) {

                target.classList.add("active");

            }


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });


            if (page === "cart") {

                renderCart();

            }


            lucide.createIcons();

        }


        /* =========================
           SLIDER
        ========================= */

        let currentSlide = 0;

        const totalSlides = 3;


        function updateSlider() {

            const track =
                document.getElementById("sliderTrack");

            if (!track) return;

            track.style.transform =
                `translateX(-${currentSlide * 100}%)`;


            document
                .querySelectorAll(".slider-dot")
                .forEach((dot, index) => {

                    dot.classList.toggle(
                        "active",
                        index === currentSlide
                    );

                });

        }


        function changeSlide(direction) {

            currentSlide += direction;

            if (currentSlide >= totalSlides) {

                currentSlide = 0;

            }

            if (currentSlide < 0) {

                currentSlide = totalSlides - 1;

            }

            updateSlider();

        }


        function createSliderDots() {

            const dots =
                document.getElementById("sliderDots");

            if (!dots) return;

            dots.innerHTML = "";

            for (
                let i = 0;
                i < totalSlides;
                i++
            ) {

                const button =
                    document.createElement("button");

                button.className =
                    "slider-dot";

                if (i === 0) {
                    button.classList.add("active");
                }

                button.onclick = () => {

                    currentSlide = i;

                    updateSlider();

                };

                dots.appendChild(button);

            }

        }


        function startSlider() {

            setInterval(() => {

                changeSlide(1);

            }, 5000);

        }


        /* =========================
           INITIALIZE
        ========================= */

        function initialize() {

            renderProducts();

            updateCartCount();

            renderCart();

            createSliderDots();

            updateSlider();

            startSlider();

            lucide.createIcons();

        }


        document.addEventListener(
            "DOMContentLoaded",
            initialize
        );

    </script>

</body>
</html>
